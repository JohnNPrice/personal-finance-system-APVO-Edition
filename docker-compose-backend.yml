services:
  backend:
    build: ./backend
    environment:
      PORT: 3000
      MONGO_URI: mongodb://admin:12345@mongo1:27017,mongo2:27017,mongo3:27017/pis?replicaSet=rs0&authSource=admin
      REDIS_HOST: redis
      REDIS_PORT: 6379
    expose:
      - "3000"
    depends_on:
      - redis
    networks:
      - pis-net
    logging:
      driver: gelf
      options:
        gelf-address: "udp://host.docker.internal:12201"
        tag: "{{.Name}}"

  nginx:
    image: nginx:latest
    ports:
      - "8090:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
    networks:
      - pis-net
    logging:
      driver: gelf
      options:
        gelf-address: "udp://host.docker.internal:12201"
        tag: "{{.Name}}"

  redis:
    image: redis:7-alpine
    container_name: redis
    ports:
      - "6379:6379"
    networks:
      - pis-net

networks:
  pis-net:
    name: pis-net